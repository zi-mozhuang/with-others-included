title: Card Trivia:JJ "Kewl Tune"
wikitext: |-
  {{Navigation}}

  * a [[wikipedia:Juke Joint|Juke Joint]] is an African-American term for an informal establishment featuring music, dancing, gambling, and drinking.
  * This card's art appears to be a form of Underground Bar, a place where people can quietly enjoy a drink while listening to music (usually Jazz) or poetry, or host a [[wikipedia:Rave|Rave Party]], depending on the venue.
