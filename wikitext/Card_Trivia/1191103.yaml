title: Card Trivia:Foolish Graverobber
wikitext: |-
  {{Navigation}}

  * The card "[[Foolish Burial]]" appears in this card's artwork.
  ** This card is a reference to {{chapter|Yu-Gi-Oh!|212|ref}}, in which [[Katsuya Jonouchi (manga)|Katsuya Jonouchi]] uses "[[Foolish Burial (manga)|Foolish Burial]]" to send "[[Jinzo (manga)|Jinzo]]" to [[Rishid (manga)|Rishid]]'s Graveyard, and then uses "[[Graverobber (manga)|Graverobber]]" to Summon it to his own field.
  * This card is a [[retrain]]ed counterpart of "[[Graverobber]]".
