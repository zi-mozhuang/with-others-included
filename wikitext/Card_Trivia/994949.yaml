title: Card Trivia:Dice Demon
wikitext: |-
  {{Navigation}}

  * This is the ''[[Rush Duel]]'' [[Monster Card]] version of "[[Skull Dice (Rush Duel)|Skull Dice]]".
  ** This monster's Japanese name (サイコロの悪魔 ''Saikoro no Akuma'') is an inverse of "Demon's Dice" (悪魔のサイコロ ''Akuma no Saikoro''), the Japanese name of "Skull Dice".
  * This monster has an older version: "[[Dice Archdemon]]".
  * This monster has an [[ATK]]/[[DEF]]-increasing [[counterpart]]: "[[Dice Angel]]".

