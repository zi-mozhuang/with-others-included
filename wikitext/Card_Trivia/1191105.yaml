title: Card Trivia:Alligator's Sword Dragon Knight
wikitext: |-
  {{Navigation}}

  * This monster is a [[retrained]] [[Main Deck]] [[Dark Time Wizard (series)|Dark Time Wizard]] counterpart of "[[Alligator's Sword Dragon]]".
  ** This monster's [[direct attack]] effect is based on the ''[[OCG]]''/''[[TCG]]'' effect of "Alligator's Sword Dragon", which allows it to attack the opponent directly if the only [[face-up]] monsters they control are [[EARTH]], [[WATER]], or [[FIRE]].
