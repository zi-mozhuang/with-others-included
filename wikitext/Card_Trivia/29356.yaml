title: Card Trivia:Fairy Box
wikitext: |-
  {{Navigation}}

  * This card is based on the "[[wikipedia:Whac-A-Mole|Whac-A-Mole]]" arcade redemption game and its variants; its effect in the original [[Yu-Gi-Oh! (anime)|Yu-Gi-Oh!]] anime somewhat replicates the mechanics of the game.
  * This card has a [[retrained]] counterpart: "[[Reversal Box]]".
