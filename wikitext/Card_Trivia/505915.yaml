title: Card Trivia:Swords of Concealing Light
wikitext: |-
  {{Navigation}}

  * This card has a counterpart, "[[Swords of Revealing Light]]".
  * This card's [[effect]] is more like the effect "Swords of Revealing Light" in the first season. It only affects the [[monster]]s on the [[field]] during the [[turn]] it is [[activate]]d, and is [[destroy]]ed during the user's turn.
