title: Card Trivia:RGB Rainbowlution
wikitext: |-
  {{Navigation}}

  * "[[Berserk Gorilla]]", "[[Scrap Kong]]", and "[[Shien's Squire]]" appear in this card's artwork.
  * The number "16,770,000" in this card's Japanese base kanji name is an approximation of the maximum number of color combinations that can be generated using RGB (red, green, blue) notation, which is 16,777,216.
