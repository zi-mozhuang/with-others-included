title: Card Trivia:The Gross Ghost of Fled Dreams
wikitext: |-
  {{Navigation}}

  * This card was likely named in honor of Norman J. Grossfeld, the president of 4Kids Productions at the time.
  * This card's ''[[OCG]]''/''[[TCG]]'' artwork is taken from {{chapter|Yu-Gi-Oh!|204|ref}}, specifically from the panel showing [[The Gross Ghost of Fled Dreams (manga)|this monster]] being Summoned.
  * "[[Dark Spirit of Banishment]]" is a combination of this card, "[[Dark Spirit of the Silent]]", and "[[Headless Knight]]".
