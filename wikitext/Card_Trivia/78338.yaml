title: Card Trivia:D.D.R. - Different Dimension Reincarnation
wikitext: |-
  {{Navigation}}

  * The same figure from the artwork of "[[Premature Burial]]" appears in this card's artwork.
  * This card shares its name with ''[[wikipedia:Dance Dance Revolution|Dance Dance Revolution]]'' (D.D.R for short), which is also a [[Konami]] game.
  ** Konami acknowledged this in ''[[Yu-Gi-Oh! 5D's World Championship 2010: Reverse of Arcadia]]'' by putting it in [[Nanobreaker (character)|Nanobreaker's]] Konami themed Deck.
  * This is one of few cards to have both the acronym version of its name and the written out version of its name as its whole name.
