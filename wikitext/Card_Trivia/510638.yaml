title: Card Trivia:Graceful Dice
wikitext: |-
  {{Navigation}}

  * This is one of the [[cover card]]s of ''[[Structure Deck: Joey]]''.
  * The angel in this card's artwork appears in the artworks of "[[Dicetadium of Fate]]", "[[Frightfur Parade]]", "[[Star Blaster]]", and "[[Toy Parade]]".
  ** The blue die appears in the artworks of "[[Dice Archangel]]", "[[Fusion Recycling Plant]]", "[[Twister]]", and "[[Weighbridge]]".
  *** This card has a ''[[Rush Duel]]'' [[Monster Card]] [[counterpart]], "[[Dice Angel]]", which features both the angel and the blue die.
  * This card has an [[ATK]]/[[DEF]]-decreasing counterpart: "[[Skull Dice]]".
  * In ''[[Yu-Gi-Oh! Rush Duel]]'', this card is revealed as a [[Normal Spell Card]] instead of its [[Quick-Play Spell]] [[property]].
