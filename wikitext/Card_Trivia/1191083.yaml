title: Card Trivia:Red-Eyes Black Dragon Exceed
wikitext: |-
  {{Navigation}}

  * This is the [[cover card]] of ''[[Beyond The Brave]]''.
  * This monster is an [[aged counterpart]] of "[[Red-Eyes Black Dragon]]".
  * This monster is a [[Fusion Monster]] counterpart of "[[Red-Eyes Black Fullmetal Dragon]]".
  ** Both monsters are advanced versions of "Red-Eyes" which have [[3400 ATK Monster Cards|3400 ATK]].
  ** This monster's immunity to [[Spell Card|Spell]] effects references "[[Metalmorph (manga)|Metalmorph]]" in the ''[[Yu-Gi-Oh! (manga)|Yu-Gi-Oh!]]'' manga ("[[Magic Metal Force]]" in the [[Yu-Gi-Oh! (anime)|anime]]), which makes the [[equip]]ped monster immune to destruction by [[Spell Card]]s and magical attacks.
