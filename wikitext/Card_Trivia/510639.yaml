title: Card Trivia:Skull Dice
wikitext: |-
  {{Navigation}}

  * This is one of the [[cover card]]s of ''[[Structure Deck: Joey]]''.
  * The demon in this card's artwork appears in the artworks of "[[Dicetadium of Fate]]" and "[[Star Blaster]]".
  ** The red die appears in the artworks of "[[Dice Archdemon]]", "[[Fusion Recycling Plant]]", "Star Blaster", "[[Twister]]", and "[[Weighbridge]]".
  *** This card has a ''[[Rush Duel]]'' [[Monster Card]] [[counterpart]], "[[Dice Demon]]", which features both the demon and the red die.
  * This card has an [[ATK]]/[[DEF]]-increasing counterpart: "[[Graceful Dice]]".
